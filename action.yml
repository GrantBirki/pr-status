name: "pr-status"
description: "A dependency-free runtime action that checks pull request status on GitHub.com"
author: "Grant Birkinbine"
branding:
  icon: 'check'
  color: 'green'
inputs:
  github_token:
    description: The GitHub.com token used to read pull request state and, when requested, reconcile labels
    default: ${{ github.token }}
    required: true
  mode:
    description: Exactly `status` for the existing evaluation behavior or `branch-deploy` for exact branch-deploy-status label reconciliation
    default: status
    required: false
  workflow:
    description: The exact, case-sensitive current job/check name to exclude so this action does not evaluate itself
    default: ${{ github.job }}
    required: false
  pr_number:
    description: A positive integer identifying the pull request to evaluate; branch-deploy mode resolves supported events when omitted
    default: ''
    required: false
  checks:
    description: Exactly `required` or `all`, selecting which CI checks to evaluate
    default: all
    required: true
  evaluations:
    description: 'A case-sensitive comma-separated list containing approved, ci_passing, mergeable, not_draft, or min_approvals=N. Invalid criteria fail the action; an explicitly empty list evaluates to PASS.'
    default: 'approved' # this says that the pull request must be approved and that is it
    required: false
  pass_labels:
    description: A comma-separated list of labels to apply when evaluation passes
    default: ''
    required: false
  pass_labels_cleanup:
    description: 'A comma-separated list of labels to remove when evaluation passes'
    default: ''
    required: false
  fail_labels:
    description: A comma-separated list of labels to apply when evaluation fails
    default: ''
    required: false
  exclude_checks:
    description: 'A case-sensitive comma-separated list of exact check names to exclude from CI evaluation'
    default: ''
    required: false
  transition:
    description: In branch-deploy mode, exactly `reset`, `review`, `noop`, `deploy`, or `clear`; omit to resolve a supported GitHub event
    default: ''
    required: false
  expected_head_sha:
    description: In branch-deploy mode, the pull request head SHA observed by a reset, noop, or deploy transition
    default: ''
    required: false
  operation_result:
    description: In branch-deploy mode, exactly `success`, `failure`, `cancelled`, or `skipped` for noop and deploy transitions
    default: ''
    required: false
  noop_label:
    description: Branch-deploy label for a pull request waiting for noop
    default: ready-for-noop
    required: false
  review_label:
    description: Branch-deploy label for a pull request waiting for review
    default: ready-for-review
    required: false
  deploy_label:
    description: Branch-deploy label for a pull request waiting for deployment
    default: ready-for-deployment
    required: false
  merge_label:
    description: Branch-deploy label for a pull request waiting to merge
    default: ready-to-merge
    required: false
  clear_on_draft:
    description: Whether branch-deploy mode clears managed labels while the pull request is a draft
    default: 'true'
    required: false
  demote_merge_on_review_failure:
    description: Whether a review failure moves the merge state back to waiting for review
    default: 'true'
    required: false
  dry_run:
    description: Whether branch-deploy mode reports the desired state without changing labels
    default: 'false'
    required: false
outputs:
  branch_deploy_reconciled:
    description: 'In branch-deploy mode, true when the event was reconciled and false when it was intentionally ignored'
  branch_deploy_state:
    description: 'In branch-deploy mode, the converged state: cleared, noop, review, deploy, or merge'
  head_sha:
    description: The current pull request head commit SHA
  head_matches:
    description: 'In branch-deploy mode, true when expected_head_sha matches the live head for reset, noop, or deploy, false when stale; empty otherwise'
  approved:
    description: 'The string "true" when reviewDecision is APPROVED or null, and "false" otherwise'
  total_approvals:
    description: 'The number of unique non-bot actors whose latest review is APPROVED'
  review_decision:
    description: 'The pull request review decision, such as APPROVED, CHANGES_REQUESTED, or REVIEW_REQUIRED; empty when GitHub returns null'
  merge_state_status:
    description: 'The pull request merge state status: CLEAN, DIRTY, BLOCKED, BEHIND, UNSTABLE, HAS_HOOKS, or UNKNOWN'
  mergeable_state:
    description: 'The pull request mergeable state: MERGEABLE, CONFLICTING, or UNKNOWN'
  commit_status:
    description: 'The normalized CI status for the latest commit: SUCCESS, FAILURE, PENDING, or UNKNOWN'
  is_draft:
    description: 'The string "true" if the pull request is in draft status, "false" otherwise'
  evaluation:
    description: 'PASS or FAIL after ANDing every requested criterion. FAIL is a normal result and does not fail the action step.'
runs:
  using: "node24"
  main: "dist/index.js"
