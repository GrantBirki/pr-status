name: test
on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # pin@v6
        with:
          persist-credentials: false

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # pin@v6
        with:
          node-version-file: .node-version
          cache: 'npm'

      - name: verify toolchain and package age policy
        run: |
          set -euo pipefail
          test "$(node --version)" = 'v24.16.0'
          test "$(npm --version)" = '11.13.0'
          node --input-type=module -e "import {execFileSync} from 'node:child_process'; const before = Date.parse(execFileSync('npm', ['config', 'get', 'before'], {encoding: 'utf8'}).trim()); const ageDays = (Date.now() - before) / 86_400_000; if (!Number.isFinite(before) || ageDays < 44.9 || ageDays > 45.1) throw new Error('npm did not apply min-release-age=45')"

      - name: install dependencies
        run: npm ci --ignore-scripts

      - name: test
        run: npm test

      - name: verify coverage badge is current
        run: |
          if [ -n "$(git status --porcelain -- badges/coverage.svg)" ]; then
            echo "The coverage badge is not current. Run npm test and commit the result."
            git status --short -- badges/coverage.svg
            git diff -- badges/coverage.svg
            exit 1
          fi
