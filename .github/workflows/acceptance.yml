name: acceptance

on:
  pull_request:

permissions:
  checks: read
  contents: read
  pull-requests: read
  statuses: read

jobs:
  acceptance:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # pin@v6
        with:
          persist-credentials: false

      - name: evaluate pull request
        id: pr_status
        uses: ./
        with:
          pr_number: ${{ github.event.pull_request.number }}
          evaluations: not_draft

      - name: verify outputs
        env:
          ACTUAL_COMMIT_STATUS: ${{ steps.pr_status.outputs.commit_status }}
          ACTUAL_EVALUATION: ${{ steps.pr_status.outputs.evaluation }}
          ACTUAL_IS_DRAFT: ${{ steps.pr_status.outputs.is_draft }}
          ACTUAL_TOTAL_APPROVALS: ${{ steps.pr_status.outputs.total_approvals }}
          EXPECTED_EVALUATION: ${{ github.event.pull_request.draft && 'FAIL' || 'PASS' }}
          EXPECTED_IS_DRAFT: ${{ github.event.pull_request.draft }}
        run: |
          set -euo pipefail

          if [[ "${ACTUAL_IS_DRAFT}" != "${EXPECTED_IS_DRAFT}" ]]; then
            echo "Expected is_draft=${EXPECTED_IS_DRAFT}, got ${ACTUAL_IS_DRAFT}"
            exit 1
          fi

          if [[ "${ACTUAL_EVALUATION}" != "${EXPECTED_EVALUATION}" ]]; then
            echo "Expected evaluation=${EXPECTED_EVALUATION}, got ${ACTUAL_EVALUATION}"
            exit 1
          fi

          if [[ ! "${ACTUAL_TOTAL_APPROVALS}" =~ ^[0-9]+$ ]]; then
            echo "Expected total_approvals to be a non-negative integer"
            exit 1
          fi

          case "${ACTUAL_COMMIT_STATUS}" in
            SUCCESS|FAILURE|PENDING|UNKNOWN) ;;
            *)
              echo "Unexpected commit_status: ${ACTUAL_COMMIT_STATUS}"
              exit 1
              ;;
          esac

  branch-deploy-status-dry-run:
    name: branch-deploy-status dry run
    permissions:
      checks: read
      contents: read
      pull-requests: read
      statuses: read
    uses: ./.github/workflows/branch-deploy-status.yml
    with:
      dry_run: true

  verify-branch-deploy-status-dry-run:
    name: verify native branch-deploy-status dry run
    needs: branch-deploy-status-dry-run
    runs-on: ubuntu-latest
    steps:
      - name: verify event reconciliation
        env:
          RECONCILED: ${{ needs.branch-deploy-status-dry-run.outputs.branch_deploy_reconciled }}
        run: test "${RECONCILED}" = "true"
